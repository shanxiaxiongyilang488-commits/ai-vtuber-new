name: Validate ComfyUI video candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Worker contracts
        run: python -m unittest discover -s runpod/video -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runpod/video
          file: runpod/video/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shanxiaxiongyilang488-commits/ai-vtuber-runpod-video:comfy-validation-${{ github.sha }}
          cache-from: type=gha,scope=runpod-video
          cache-to: type=gha,mode=max,scope=comfy-validation
          provenance: false
