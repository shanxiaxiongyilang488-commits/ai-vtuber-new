name: Build RunPod workers

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker image to build
        required: true
        default: unified
        type: choice
        options:
          - voice
          - video
          - unified
          - speech-cpp
      speech_model:
        description: speech.cpp GGUF model
        required: true
        default: irodori-tts
        type: choice
        options:
          - irodori-tts
          - irodori-tts-mf

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.worker }} worker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: voice
            context: runpod/voice
            dockerfile: runpod/voice/Dockerfile
          - worker: video
            context: runpod/video
            dockerfile: runpod/video/Dockerfile
          - worker: unified
            context: runpod
            dockerfile: runpod/unified/Dockerfile
          - worker: speech-cpp
            context: .
            dockerfile: runpod/speech-cpp/Dockerfile
    steps:
      - name: Check selection
        id: selection
        shell: bash
        run: |
          if [[ "${{ inputs.worker }}" == "${{ matrix.worker }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.selection.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Verify RunPod worker contracts
        if: steps.selection.outputs.enabled == 'true' && matrix.worker != 'speech-cpp'
        shell: bash
        run: |
          python runpod/unified/test_bridge_auth.py
          python runpod/unified/test_entrypoint_contract.py
          python -m unittest discover -s runpod/voice -p 'test_*.py'
          python -m unittest discover -s runpod/video -p 'test_*.py'

      - name: Verify speech.cpp worker contracts
        if: steps.selection.outputs.enabled == 'true' && matrix.worker == 'speech-cpp'
        run: python -m unittest discover -s runpod/speech-cpp -p 'test_*.py'

      - name: Set up Docker Buildx
        if: steps.selection.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.selection.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        if: steps.selection.outputs.enabled == 'true'
        id: image
        shell: bash
        run: |
          if [[ "${{ matrix.worker }}" == "speech-cpp" ]]; then
            echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-vtuber-runpod-voice" >> "$GITHUB_OUTPUT"
            echo "tag=speech-cpp-0.8.6-${{ inputs.speech_model }}" >> "$GITHUB_OUTPUT"
            echo "immutable=speech-cpp-0.8.6-${{ inputs.speech_model }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-vtuber-runpod-${{ matrix.worker }}" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "immutable=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.selection.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: |
            SPEECH_MODEL=${{ inputs.speech_model }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.immutable }}
          cache-from: type=gha,scope=runpod-${{ matrix.worker }}
          cache-to: type=gha,mode=max,scope=runpod-${{ matrix.worker }}
          provenance: false
